<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SnoopsGem : Crystal</title>

    <!-- Stylesheets, loaded in cascade order: reset/base → theme → menu → board. -->
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/menu.css" />
    <link rel="stylesheet" href="css/game-board.css" />
  </head>
  <body>
    <!-- Single mount root: the Router mounts every screen into this element. -->
    <div id="app"></div>

    <!--
      Static, no-JS fallback error region. Hidden by default via the `hidden`
      attribute and revealed by the bootstrap `try/catch` (or the missing-`#app`
      guard) if the entry module fails to load or execute, so the viewport is
      never left blank on a fatal startup failure.
    -->
    <div id="boot-error" hidden>The game failed to load.</div>

    <!-- Shown when JavaScript is disabled entirely. -->
    <noscript>
      This game requires JavaScript to be enabled in your browser.
    </noscript>

    <!-- Exactly one module entry point. -->
    <script type="module" src="js/main.js"></script>
  </body>
</html>
